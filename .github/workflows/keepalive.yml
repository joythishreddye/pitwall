name: Keep-alive

# Twice a day: keeps the Supabase Free project from pausing (it pauses after
# 7 days without database activity) and alerts by email when the API, its
# database or its LLM is down. A degraded embedding service is reported in
# the run summary but doesn't fail the run: chat falls back to full-text search.
#
# It also alerts on traffic that could cost money: Render bills bandwidth
# past 5 GB a month, and refused requests still use some. It fails when the
# API's daily data budget closed or refusals spiked, today or yesterday.
#
# GitHub disables scheduled workflows after 60 days without repository
# activity. If that happens, re-enable it from the Actions tab.

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://pitwall-api-dfyi.onrender.com
    steps:
      - name: Check readiness
        run: |
          body=$(curl -sS --max-time 90 "$API_URL/health/ready" || true)
          {
            echo "### PitWall readiness"
            echo '```json'
            echo "${body:-no response}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$body" | python3 -c '
          import json, sys
          try:
              body = json.load(sys.stdin)
              checks = body["checks"]
          except Exception:
              sys.exit("API did not answer with a readiness report")
          down = [k for k in ("database", "llm", "intent_llm") if checks.get(k) != "ok"]
          if down:
              sys.exit("Down: " + ", ".join(down))
          traffic = body.get("traffic") or {}
          for day in ("today", "yesterday"):
              t = traffic.get(day) or {}
              if t.get("budget_closed"):
                  sys.exit(f"Traffic alert ({day}): the daily data budget closed the API")
              n = t.get("refused_requests", 0)
              if n > 100_000:
                  sys.exit(f"Traffic alert ({day}): {n} refused requests, a possible flood")
              u = t.get("unmetered_requests", 0)
              if u > 100_000:
                  sys.exit(f"Traffic alert ({day}): {u} health-check or preflight requests, a possible flood")
          print("OK:", checks, traffic)
          '
